<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="stampGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9E182A" />
      <stop offset="75%" stop-color="#6B0C1A" />
      <stop offset="100%" stop-color="#420610" />
    </radialGradient>
    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <g filter="url(#stampShadow)">
    <!-- Wavy wax seal border -->
    <path d="
      M 60 5
      C 67 5, 74 10, 81 12 C 88 14, 96 15, 101 21 C 106 27, 107 35, 110 42 C 113 49, 116 56, 115 63
      C 114 70, 109 77, 106 83 C 103 89, 99 96, 93 100 C 87 104, 79 104, 72 107 C 65 110, 58 115, 50 114
      C 42 113, 36 108, 29 105 C 22 102, 14 101, 10 94 C 6 87, 8 79, 6 72 C 4 65, 1 58, 3 50
      C 5 42, 10 36, 14 30 C 18 24, 21 16, 28 13 C 35 10, 42 13, 50 8 C 54 5, 57 5, 60 5 Z"
      fill="url(#stampGrad)"
      stroke="#B82438"
      stroke-width="1.5"
    />
    <!-- Inner concentric circle -->
    <circle cx="60" cy="60" r="44" stroke="#DCA2AB" stroke-width="1.4" stroke-dasharray="3 2" fill="none" opacity="0.75" />
    
    <!-- Text: JOIE DE VIVRE -->
    <text x="60" y="52" font-family="'Inter', 'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#FFF2F4" text-anchor="middle" letter-spacing="2">JOIE DE</text>
    <text x="60" y="72" font-family="'Inter', 'Montserrat', sans-serif" font-size="14" font-weight="900" fill="#FFF2F4" text-anchor="middle" letter-spacing="2.5">VIVRE</text>

    <!-- Tiny strawberry/star between words -->
    <circle cx="60" cy="84" r="2.5" fill="#F4A259" />
  </g>
</svg>
