  <path d="M 52 32 C 58 26, 64 30, 60 38" stroke-width="1.3" opacity="0.6" />
  <!-- Center Knot -->
  <ellipse cx="40" cy="35" rx="5" ry="4.5" fill="#7D1535" />
  <!-- Left Tail -->
  <path d="M 37 38 C 30 48, 22 58, 16 68 C 22 66, 26 64, 30 70 C 31 58, 34 48, 38 40" stroke-width="1.8" fill="#FFF2F6" />
  <!-- Right Tail -->
