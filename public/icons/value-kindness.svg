<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none" stroke="#7D1535" stroke-linecap="round" stroke-linejoin="round">
  <!-- Elegant satin ribbon bow line art -->
