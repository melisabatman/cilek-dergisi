  <path d="M 40 34 C 24 16, 8 20, 14 36 C 20 48, 34 38, 40 36" stroke-width="1.8" fill="#FFF2F6" />
  <path d="M 28 32 C 22 26, 16 30, 20 38" stroke-width="1.3" opacity="0.6" />
  <!-- Right Bow loop -->
